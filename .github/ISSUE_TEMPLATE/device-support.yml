name: Device / OEM Variant Request
description: Request support for a new Android ROM, OEM quirk, or kernel compatibility profile
title: "[Device]: "
labels: ["device-support", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        > **Privacy Notice**: Never paste your device serial (`ro.serialno`), IMEI, MAC address, IP addresses, or raw `dumpsys` dumps.
        > Only attach the anonymized output generated by `tools/probe_device.ps1` or `tools/probe_device.sh`.
  - type: input
    id: device-model
    attributes:
      label: Brand & Commercial Device Name
      description: General model name only (no serial number)
      placeholder: e.g. Pixel 9 Pro / OnePlus 13 / Galaxy S24
    validations:
      required: true
  - type: input
    id: rom-info
    attributes:
      label: ROM / OEM Flavor & Android Version
      placeholder: e.g. HyperOS 2.0 (Android 15) / LineageOS 22 (Android 15)
    validations:
      required: true
  - type: textarea
    id: device-profile
    attributes:
      label: Anonymized device_profile.json & select_variant.py output
      description: Run `./tools/probe_device.ps1 -Out ./dist/device_profile.json` (or `.sh`) and `python ./tools/select_variant.py --profile ./dist/device_profile.json --json`
      render: json
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed Compatibility Issue or Requested OEM Hook
      description: Explain what failed or what OEM-specific behavior needs a compile-time build profile.
    validations:
      required: true
