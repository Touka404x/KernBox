name: Feature Request
description: Suggest an improvement to KernBox isolation, controller UX, presets, or tooling
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep suggestions aligned with KernBox's honest threat-model boundary and privacy rules.
        Never post hardware serials, private IPs, or personal subscription configs.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What isolation, UX, or automation gap are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the expected behavior across guard, controller, stealth, verify, or packaging.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Component Area
      options:
        - guard (Netfilter / Daemon / Lifecycle)
        - stealth (Zygisk PLT / Binder Proxy)
        - controller (KernBox.apk)
        - verify (KernBoxVerify.apk)
        - packaging / presets / tools
        - Documentation / AI Playbooks
    validations:
      required: true
