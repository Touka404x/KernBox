name: CI Verification & Multi-Variant Checks

on:
  push:
    branches: [oss-main, main]
  pull_request:
    branches: [oss-main, main]

permissions:
  contents: read

jobs:
  hygiene-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Privacy & CRLF Gatekeeper
        run: python tools/verify_privacy_leak.py
      - name: Python Variant Selector & Packaging Unit Tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Shellcheck on rendered packaging & tool scripts
        run: |
          mkdir -p /tmp/sc-stage/out
          printf '\177ELFdummy' > /tmp/sc-stage/dummy
          python packaging/pack_variant.py --oem hyperos --kernel k510 --root ksu \
            --guard-bin /tmp/sc-stage/dummy --broker-bin /tmp/sc-stage/dummy --zygisk-so /tmp/sc-stage/dummy \
            --out /tmp/sc-stage/KernBox-sc.zip --quiet
          python -c "import zipfile; zipfile.ZipFile('/tmp/sc-stage/KernBox-sc.zip').extractall('/tmp/sc-stage/out')"
          shellcheck -s sh -S warning -e SC3043,SC2034,SC2154 /tmp/sc-stage/out/*.sh
          shellcheck -s sh -S warning tools/probe_device.sh

  go-multi-variant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tags:
          - oem_hyperos
          - oem_aosp
          - oem_oplus
          - oem_oneui
          - oem_generic
          - "oem_generic,kernel_compat,transport_vpn"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: guard/go.mod
          cache-dependency-path: guard/go.sum
      - name: Go vet (host & linux/arm64)
        working-directory: guard
        run: |
          go vet -tags "${{ matrix.tags }}" ./...
          GOOS=linux GOARCH=arm64 go vet -tags "${{ matrix.tags }}" ./...
          GOOS=linux GOARCH=arm64 go build -tags "${{ matrix.tags }}" -o /tmp/guard ./cmd/guard
          GOOS=linux GOARCH=arm64 go build -tags "${{ matrix.tags }}" -o /tmp/broker ./cmd/broker
          if GOOS=linux GOARCH=arm64 go list -tags "${{ matrix.tags }}" -deps ./cmd/guard ./cmd/broker | grep -qx testing; then
            echo "ERROR: testing package linked into production binary"
            exit 1
          fi
      - name: Go test (-race)
        working-directory: guard
        run: go test -race -count=1 -timeout 120s -tags "${{ matrix.tags }}" ./...

  stealth-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android 35 SDK platform & build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: C11 native broker unit tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror broker/broker_core.c broker/tests/broker_test.c -o /tmp/broker_test
          /tmp/broker_test
      - name: C++ 5-OEM stealth logic tests
        run: |
          for oem in OEM_HYPEROS OEM_OPLUS OEM_ONEUI OEM_AOSP OEM_GENERIC; do
            g++ -std=c++17 -O2 -Wall -Wextra -Werror "-D$oem" stealth/tests/stealth_logic_test.cpp -o /tmp/stealth_test
            /tmp/stealth_test
          done
      - name: Java StealthHookHostTest
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p /tmp/stealth_classes
          javac --release 11 -encoding UTF-8 -Xlint:all -Werror -cp "$ANDROID_JAR" -d /tmp/stealth_classes \
            stealth/java/com/sandbox/stealth/*.java stealth/tests/StealthHookHostTest.java
          java -cp "/tmp/stealth_classes:$ANDROID_JAR" com.sandbox.stealth.StealthHookHostTest

      - name: Java Controller BrokerProtocolHostTest
        run: |
          mkdir -p /tmp/ctrl_classes
          javac --release 11 -encoding UTF-8 -Xlint:all -Werror -d /tmp/ctrl_classes \
            controller/java/com/sandbox/controller/BrokerProtocol.java \
            controller/java/com/sandbox/controller/Strings.java \
            controller/tests/BrokerProtocolHostTest.java
          java -cp /tmp/ctrl_classes com.sandbox.controller.BrokerProtocolHostTest
      - name: Build Controller & Verify APKs
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          python3 controller/build-controller.py --out /tmp/KernBox.apk
          python3 verify/build-probe.py --out /tmp/KernBoxVerify.apk
